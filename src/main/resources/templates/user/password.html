<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
        .btn-primary { background-color: #e94560; border-color: #e94560; }
        .btn-primary:hover { background-color: #c73652; border-color: #c73652; }
        .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 0.2rem rgba(233,69,96,.25); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">홈</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/user/password}">비밀번호 변경</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container flex-grow-1" style="max-width: 500px;">
    <div class="page-header mb-4">
        <h4 class="fw-bold mb-0">비밀번호 변경</h4>
        <small class="text-muted">현재 비밀번호 확인 후 변경합니다.</small>
    </div>

    <div th:if="${successMessage}" class="alert alert-success py-2" th:text="${successMessage}"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/user/password}" method="post" th:object="${passwordChangeDto}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">현재 비밀번호 <span class="text-danger">*</span></label>
                    <input type="password" name="currentPassword" class="form-control"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                           placeholder="현재 비밀번호 입력"/>
                    <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">새 비밀번호 <span class="text-danger">*</span></label>
                    <input type="password" name="newPassword" class="form-control"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                           placeholder="8자 이상 입력"/>
                    <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">새 비밀번호 확인 <span class="text-danger">*</span></label>
                    <input type="password" name="confirmPassword" class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           placeholder="새 비밀번호 재입력"/>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-semibold px-4">변경 완료</button>
                    <a th:href="@{/home}" class="btn btn-outline-secondary px-4">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container-fluid py-3 text-center small mt-auto" style="color: rgba(0,0,0,0.4);">
    학번: 2171180 &nbsp;|&nbsp; 성명: 박영호 &nbsp;|&nbsp;
    실습 수행: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
